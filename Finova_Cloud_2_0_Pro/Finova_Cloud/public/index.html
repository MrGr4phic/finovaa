/* Finova Cloud — security, authentication and sync status */
.sync-chip{display:inline-flex;align-items:center;white-space:nowrap;gap:5px;border:1px solid #ccece2;background:#ecfaf4;color:#16866b;border-radius:30px;font-size:11px;font-weight:800;padding:9px 12px}
.sync-chip.saving{border-color:#f0e4b8;background:#fff9e7;color:#a17b12}
.sync-chip.error{border-color:#ffbdc7;background:#fff0f2;color:#d4334d}
.side-user{font-size:12px;color:#e1e6ff;padding-top:10px;font-weight:700}
.side-signout{font-size:11px;margin-top:7px;color:#c7ccff;background:transparent;border:none;padding:3px 0;text-decoration:underline}
.security-form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:23px 0}
.security-form .form-field{min-width:180px;flex:1}
.sync-alert{position:fixed;bottom:20px;left:50%;z-index:900;transform:translateX(-50%);background:#fff;border:1px solid #efbec4;border-left:5px solid #dc4053;box-shadow:0 16px 60px #17223c35;border-radius:16px;padding:18px 21px;max-width:min(780px,calc(100% - 26px));width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sync-alert strong{font-size:14px}.sync-alert p{font-size:12px;color:#666;line-height:1.5;margin:6px 0 0}.sync-alert-buttons{display:flex;gap:7px;flex-wrap:wrap}

.logo.big{width:62px;height:62px;font-size:32px}

.auth-bottom{font-size:10px;letter-spacing:1.2px;color:#697895;font-weight:700}

 ['income',68000,-1,'Kurumsal iş ödemesi','Hizmet Satışı','a1','c1'],['income',56000,-1,'Proje avansı','Hizmet Satışı','a2','c1'],['expense',28500,-1,'Ekipman alımı','Ekipman','a1','c2'],['income',49000,-2,'Perakende satış','Ürün Satışı','a1',null],['expense',14500,-2,'Tedarikçi','Tedarik','a2','c2'],['income',35500,-3,'Proje tahsilatı','Hizmet Satışı','a1','c1'],['expense',8700,-3,'Operasyon','Operasyon','a1',null]
 ].map((t,i)=>({id:'t'+i,type:t[0],amount:t[1],date:m(t[2],Math.min(4+i*2,27)),description:t[3],category:t[4],accountId:t[5],contactId:t[6],toAccountId:null,obligationId:null}));

return {demo:true,accounts:[{id:'a1',name:'Ticari Hesap',bank:'İş Bankası',opening:240000},{id:'a2',name:'Şirket Hesabı',bank:'Garanti BBVA',opening:78500},{id:'a3',name:'Nakit Kasa',bank:'Kasa',opening:12800}],contacts:[{id:'c1',name:'Örnek Müşteri A.Ş.',type:'customer',phone:'',email:''},{id:'c2',name:'Örnek Tedarik Ltd.',type:'supplier',phone:'',email:''},{id:'c3',name:'Ofis Yönetimi',type:'both',phone:'',email:''}],transactions:trans,obligations:[{id:'o1',type:'receivable',description:'Proje 2. etap tahsilatı',contactId:'c1',amount:65000,dueDate:addDays(4)},{id:'o2',type:'payable',description:'Tedarikçi faturası',contactId:'c2',amount:28000,dueDate:addDays(7)},{id:'o3',type:'payable',description:'Kira ödemesi',contactId:'c3',amount:18500,dueDate:addDays(13)},{id:'o4',type:'receivable',description:'Aylık hizmet faturası',contactId:'c1',amount:34000,dueDate:addDays(-3)}]};}
const blank=()=>({demo:false,accounts:[],contacts:[],transactions:[],obligations:[]});
let state=blank();
let currentUser=null, signupEnabled=true, cloudVersion=0, remoteVersion=0;
let saveTail=Promise.resolve(), pendingSaves=0, syncLocked=false, stream=null, pollingTimer=null;
let syncLabel='Buluta bağlı', syncClass='online';
const ui={page:'dashboard',txSearch:'',txType:'all',txMonth:'all',reportPeriod:'month',obFilter:'all',contactSearch:'',drawer:false};
async function api(path, opts={}){
  const res=await fetch(path,{credentials:'same-origin',cache:'no-store',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});
  let payload={};try{payload=await res.json()}catch{}
  if(!res.ok){const err=new Error(payload.message||'Sunucuya erişilemiyor.');err.status=res.status;err.code=payload.error;throw err;}
  return payload;
}
function syncStatus(label,cls='online'){
  syncLabel=label;syncClass=cls;
  const el=document.getElementById('sync-chip');
  if(el){el.textContent='● '+label;el.className='sync-chip '+cls;}
}
function syncBlocked(reason){
  if(syncLocked)return;
  syncLocked=true;pendingSaves=0;
  syncStatus('Senkronizasyon durdu','error');
  document.getElementById('sync-alert').innerHTML=`<div class="sync-alert"><div><strong>Kaydedilemeyen değişiklikler var</strong><p>${esc(reason)} Cihazınızdaki verilerin silinmemesi için önce yedek alın. Bulut verileri otomatik olarak üzerine yazılmadı.</p></div><div class="sync-alert-buttons"><button class="btn" data-action="export-json">JSON yedeği indir</button><button class="btn" data-action="retry-sync">Tekrar dene</button><button class="btn red" data-action="reload-cloud">Buluttakini yükle</button></div></div>`;
}
async function fetchCloud(force=false){
  if(!currentUser || syncLocked || pendingSaves)return;
  if(document.getElementById('modal-wrap')&&!force)return;
  try{
    const fresh=await api('/api/finance');
    if(force || fresh.version>cloudVersion){
      state=fresh.data;cloudVersion=fresh.version;remoteVersion=cloudVersion;
      render(); if(!force)toast('Diğer cihazdaki değişiklikler yüklendi.');
    }
    syncStatus('Buluta kaydedildi');
  }catch(err){
    if(err.status===401)return boot();
    syncStatus('Bağlantı kontrol ediliyor','saving');
  }
}
const save=()=>{
  if(syncLocked){toast('Senkronizasyon durdu. Önce sorunu çözün.');return;}
  const snapshot=structuredClone(state);
  pendingSaves++;syncStatus('Kaydediliyor…','saving');
  saveTail=saveTail.then(async()=>{
    if(syncLocked)return;
    const result=await api('/api/finance',{method:'PUT',body:JSON.stringify({version:cloudVersion,data:snapshot})});
    cloudVersion=result.version;
    pendingSaves--;
    if(!pendingSaves){syncStatus('Buluta kaydedildi');if(remoteVersion>cloudVersion)fetchCloud();}
  }).catch(err=>syncBlocked(err.code==='version_conflict'?'Aynı kayıt başka bir cihazda değiştirildi.':err.message));
};
function attachRealtime(){
  if(stream){stream.close();stream=null;}
  if(pollingTimer)clearInterval(pollingTimer);
  if(typeof EventSource!=='undefined'){
    stream=new EventSource('/api/stream');
    stream.addEventListener('version',event=>{
      try {remoteVersion=Math.max(remoteVersion,Number(JSON.parse(event.data).version)||0)}catch{}
      if(remoteVersion>cloudVersion && !pendingSaves && !syncLocked)fetchCloud();
    });
  }
  // Fallback if SSE is unavailable or a hosting proxy interrupts it.
  pollingTimer=setInterval(()=>{if(currentUser&&!document.hidden)fetchCloud()},12000);
  window.addEventListener('focus',()=>fetchCloud());
}
async function cloudLogin(username,password,register){
  const answer=await api(register?'/api/auth/register':'/api/auth/login',{
    method:'POST',body:JSON.stringify({username,password})});
  currentUser=answer.user;
  const fresh=await api('/api/finance');
  state=fresh.data;cloudVersion=fresh.version;remoteVersion=cloudVersion;
  syncLocked=false;pendingSaves=0;saveTail=Promise.resolve();
  document.getElementById('sync-alert').innerHTML='';
  syncStatus('Buluta kaydedildi');
  render();attachRealtime();
}
async function boot(){
  document.getElementById('app').innerHTML='<div class="loading-state"><div class="logo big">F</div><strong>Finova Cloud</strong><p>Güvenli bağlantı kuruluyor…</p></div>';
  try{
    const auth=await api('/api/auth/me');signupEnabled=auth.signupEnabled;
    if(!auth.user){currentUser=null;showAuth('login');return;}
    currentUser=auth.user;
    const fresh=await api('/api/finance');
    state=fresh.data;cloudVersion=fresh.version;remoteVersion=cloudVersion;
    syncLocked=false;pendingSaves=0;saveTail=Promise.resolve();
    syncStatus('Buluta kaydedildi');render();attachRealtime();
  }catch(err){
    document.getElementById('app').innerHTML=`<div class="loading-state"><strong>Sunucu bağlantısı kurulamadı</strong><p>${esc(err.message)}</p><button class="btn primary" data-action="boot">Yeniden dene</button></div>`;
  }
}
function showAuth(mode='login'){

  document.getElementById('app').innerHTML=`<div class="auth-layout"><div class="auth-showcase">

    <div class="auth-hero"><span class="auth-kicker">FİNANSINIZ, HER YERDE SİZİNLE</span><h1>İşinizi güvenle yönetin.<br><em>Her cihazdan.</em></h1><p>Gelir, gider, banka, cari hesap, ödeme planları ve finansal raporlar tek bir güvenli çalışma alanında.</p>
    <div class="auth-features"><span>✓ Kullanıcıya özel veriler</span><span>✓ Telefon ve bilgisayarda senkronizasyon</span><span>✓ Güvenli oturum</span></div></div>
    <div class="auth-bottom">FINOVA CLOUD • FİNANS YÖNETİM MERKEZİ</div>
  </div><div class="auth-right"><div class="auth-card"><div class="auth-mobile-brand"><div class="logo">F</div><b>finova.</b></div>
    <div class="auth-symbol">${icon('wallet',25)}</div><div class="auth-eyebrow">FİNANS YÖNETİM MERKEZİ</div><h2>${isRegister?'Hesap oluşturun':'Tekrar hoş geldiniz'}</h2><p class="auth-description">${isRegister?'Bulut çalışma alanınızı oluşturmak için bilgilerinizi girin.':'Finansal çalışma alanınıza güvenle giriş yapın.'}</p>
    <form id="auth-form" class="auth-form" data-mode="${isRegister?'register':'login'}"><label for="auth-username">Kullanıcı adı</label><input id="auth-username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" placeholder="Kullanıcı adınız" class="input">
      <label for="auth-password">Şifre</label><div class="password-holder"><input id="auth-password" name="password" autocomplete="${isRegister?'new-password':'current-password'}" type="password" ${isRegister?'minlength="12"':' '} maxlength="128" required placeholder="${isRegister?'En az 12 karakter':'Şifreniz'}" class="input"><button type="button" data-action="toggle-password" aria-label="Şifreyi göster">Göster</button></div>
      ${isRegister?'<p class="password-help">En az 12 karakterli, güçlü ve benzersiz bir şifre seçin.</p>':''}

    <div class="auth-security">🔒 Verileriniz sunucuda saklanır; bu tarayıcıda finansal kayıt depolanmaz.</div>
  </div></div></div>`;
  document.getElementById('auth-username')?.focus();
}
async function handleAuthSubmit(e){
  const f=e.target;
  if(f.id==='auth-form'){
    e.preventDefault();const b=f.querySelector('[type="submit"]');b.disabled=true;b.textContent='Giriş yapılıyor…';
    try{await cloudLogin(f.elements.namedItem('username').value,f.elements.namedItem('password').value,f.dataset.mode==='register')}
    catch(err){toast(err.message);b.disabled=false;b.innerHTML=(f.dataset.mode==='register'?'Güvenli hesap oluştur':'Giriş Yap')+' →';}
    return;
  }
  if(f.id==='change-password-form'){
    e.preventDefault();const b=f.querySelector('[type="submit"]');b.disabled=true;
    try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({oldPassword:f.elements.namedItem('oldPassword').value,newPassword:f.elements.namedItem('newPassword').value})});
      f.reset();toast('Şifreniz değiştirildi. Diğer cihazlardaki oturumlar kapatıldı.');}
    catch(err){toast(err.message)}finally{b.disabled=false}
  }
}
function accountBalance(id){const a=state.accounts.find(x=>x.id===id);if(!a)return 0;return num(a.opening)+state.transactions.reduce((s,t)=>s+(t.type==='income'&&t.accountId===id?num(t.amount):0)-(t.type==='expense'&&t.accountId===id?num(t.amount):0)+(t.type==='transfer'&&t.toAccountId===id?num(t.amount):0)-(t.type==='transfer'&&t.accountId===id?num(t.amount):0),0)}
const openAmount=o=>Math.max(0,num(o.amount)-state.transactions.filter(t=>t.obligationId===o.id).reduce((s,t)=>s+num(t.amount),0));
const contactName=id=>state.contacts.find(c=>c.id===id)?.name||'Cari hesap yok';
const accountName=id=>state.accounts.find(c=>c.id===id)?.name||'Silinmiş hesap';
const incomes=ts=>ts.filter(t=>t.type==='income').reduce((s,t)=>s+num(t.amount),0);
const expenses=ts=>ts.filter(t=>t.type==='expense').reduce((s,t)=>s+num(t.amount),0);
const currentTx=()=>state.transactions.filter(t=>t.date.startsWith(dateISO(new Date()).slice(0,7)));
const pending=()=>state.obligations.filter(o=>openAmount(o)>.005).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
const dueStatus=o=>{if(openAmount(o)<.005)return {text:'Tamamlandı',cls:'green'};if(o.dueDate<dateISO(new Date()))return {text:'Gecikmiş',cls:'red'};const days=Math.round((new Date(o.dueDate+'T12:00')-new Date(dateISO(new Date())+'T12:00'))/86400000);return days<=7?{text:'Yaklaşıyor',cls:'orange'}:{text:'Bekliyor',cls:'gray'}};
const totals=()=>({total:state.accounts.reduce((s,a)=>s+accountBalance(a.id),0),income:incomes(currentTx()),expense:expenses(currentTx()),pendingReceivable:pending().filter(o=>o.type==='receivable').reduce((s,o)=>s+openAmount(o),0),pendingPayable:pending().filter(o=>o.type==='payable').reduce((s,o)=>s+openAmount(o),0)});
function header(heading){const names={dashboard:'Genel Bakış',transactions:'Gelir & Giderler',accounts:'Banka Hesapları',contacts:'Cari Hesaplar',obligations:'Ödeme Takvimi',reports:'Finansal Raporlar',settings:'Veri & Ayarlar'};return `<header class="topbar"><button class="mobile-menu" id="open-menu" aria-label="Menüyü aç">${icon('menu')}</button><div><div class="crumb">Finans Yönetimi / ${names[ui.page]}</div><h1 class="page-title">${heading||names[ui.page]}</h1></div><div class="topright"><span class="date-pill">${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</span>${state.demo?'<span class="demo-pill">● DEMO VERİLERİ</span>':''}<span class="sync-chip ${syncClass}" id="sync-chip">● ${esc(syncLabel)}</span><div class="avatar" title="${esc(currentUser?.username||'')}">${esc((currentUser?.username||'F').slice(0,1).toUpperCase())}</div></div></header>`}
function side(){const nav=[['dashboard','Genel Bakış'],['transactions','Gelir & Giderler'],['accounts','Banka Hesapları'],['contacts','Cari Hesaplar'],['obligations','Ödeme Takvimi'],['reports','Finansal Raporlar'],['settings','Veri & Ayarlar']];return `<div class="overlay ${ui.drawer?'show':''}" data-action="close-menu"></div><aside class="sidebar ${ui.drawer?'open':''}"><div class="brand"><div class="logo">F</div><div><div class="brand-name">finova<span style="color:#8d81ff">.</span></div><div class="brand-sub">FINANS MERKEZİ</div></div></div><div class="nav-label">YÖNETİM PANELİ</div><nav class="nav">${nav.map(([k,v])=>`<button data-page="${k}" class="${ui.page===k?'active':''}">${icon(k,18)}<span>${v}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="side-cap"><strong>☁ Bulut bağlantısı etkin</strong>Finansal kayıtlarınız sunucuda tutulur. Aynı kullanıcı adıyla tüm cihazlarınızdan ulaşabilirsiniz.<div class="side-user">@${esc(currentUser?.username||'')}</div><button class="side-signout" data-action="logout">Oturumu kapat</button></div></div></aside>`}
const heading=(title,sub,buttons='')=>`<div class="heading-row"><div><div class="eyebrow">FINOVA • KONTROL MERKEZİ</div><h2>${title}</h2><p class="subtext">${sub}</p></div><div class="actions">${buttons}</div></div>`;

function stat(label,value,ic,cls,foot){return `<div class="stat"><div class="stat-head"><span>${label}</span><div class="stat-icon ${cls}">${icon(ic,18)}</div></div><div class="stat-value" title="${esc(value)}">${esc(value)}</div><div class="stat-foot">${foot}</div></div>`}
function chart(months=6,ts=state.transactions){const entries=Array.from({length:months},(_,i)=>{const d=monStart(i-months+1),m=dateISO(d).slice(0,7),a=ts.filter(t=>t.date.startsWith(m));return {name:monthName(d),income:incomes(a),expense:expenses(a)}});const max=Math.max(1,...entries.flatMap(x=>[x.income,x.expense]));return `<div class="bars" role="img" aria-label="Son ${months} ayın gelir ve gider sütun grafiği">${entries.map(e=>`<div class="bar-group"><div class="bar-pair"><div class="bar" style="height:${Math.max(e.income/max*100,e.income?2:0)}%" data-value="${esc(shortMoney(e.income))}" title="Gelir: ${esc(money(e.income))}"></div><div class="bar exp" style="height:${Math.max(e.expense/max*100,e.expense?2:0)}%" data-value="${esc(shortMoney(e.expense))}" title="Gider: ${esc(money(e.expense))}"></div></div><span class="bar-label">${esc(e.name)}</span></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Gelir</span><span><i class="dot exp"></i>Gider</span></div>`}
function accRow(a){return `<div class="account-row"><div class="account-ident"><div class="bank-icon ${a.bank==='Kasa'?'cash':''}">${a.bank==='Kasa'?'₺':icon('accounts',19)}</div><div style="min-width:0"><div class="account-name">${esc(a.name)}</div><div class="account-detail">${esc(a.bank||'Banka')}</div></div></div><div class="account-balance">${money(accountBalance(a.id))}<small>Güncel bakiye</small></div></div>`}
function recentRows(ts,compact=false){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>İşlem</th><th>Hesap</th><th>Tarih</th><th>Tutar</th>${compact?'':'<th>İşlemler</th>'}</tr></thead><tbody>${ts.map(t=>`<tr><td><div class="rowtitle">${esc(t.description||({income:'Gelir',expense:'Gider',transfer:'Virman'}[t.type]))}</div><div class="rowsub">${t.type==='transfer'?'Hesap Transferi':esc(t.category||'Diğer')} • ${badge({income:'Gelir',expense:'Gider',transfer:'Transfer'}[t.type],{income:'green',expense:'red',transfer:'gray'}[t.type])}</div></td><td>${esc(accountName(t.accountId))}${t.type==='transfer'?` → ${esc(accountName(t.toAccountId))}`:''}</td><td class="muted">${dateLabel(t.date)}</td><td class="amount ${t.type==='income'?'positive':t.type==='expense'?'negative':''}">${t.type==='income'?'+':t.type==='expense'?'−':''}${money(t.amount)}</td>${compact?'':`<td><button class="table-action" data-action="edit-tx" data-id="${esc(t.id)}">Düzenle</button><button class="table-action danger" data-action="delete-tx" data-id="${esc(t.id)}">Sil</button></td>`}</tr>`).join('')}</tbody></table></div>`}
function dueList(items){return items.length?items.map(o=>`<div class="due-item"><div class="icon-circle ${o.type==='receivable'?'green':'red'}">${icon(o.type==='receivable'?'down':'up',17)}</div><div><div class="rowtitle">${esc(o.description)}</div><div class="rowsub">${esc(contactName(o.contactId))} · ${badge(dueStatus(o).text,dueStatus(o).cls)}</div></div><div class="due-info"><div class="due-amount">${money(openAmount(o))}</div><div class="due-date">${dateLabel(o.dueDate)}</div></div></div>`).join(''):empty('Yaklaşan işlem yok','Bekleyen ödeme ve tahsilatlar burada görünür.','Kayıt ekle','new-ob')}
function dashboard(){const t=totals();const recent=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);return `${heading('Finansal durumunuz tek ekranda','Gelirler, giderler, hesap bakiyeleri ve yaklaşan işlemler.',btn(icon('plus',16)+' Yeni İşlem','new-tx','primary'))}
<div class="stats">${stat('Toplam Nakit',money(t.total),'wallet','','Tüm banka ve kasa hesapları')}${stat('Bu Ay Gelir',money(t.income),'up','green','Gerçekleşen tahsilatlar')}${stat('Bu Ay Gider',money(t.expense),'down','red','Gerçekleşen ödemeler')}${stat('Bu Ay Net Akış',money(t.income-t.expense),'clock','orange','Gelir − gider (transferler hariç)')}</div>
<div class="panels"><section class="card card-pad"><div class="card-heading"><h3>Gelir & Gider Analizi</h3><span class="mini-tab">Son 6 Ay</span></div>${chart()}</section><section class="card card-pad"><div class="card-heading"><h3>Hesap Bakiyeleri</h3><button class="table-action" data-page="accounts">Tümünü Gör →</button></div>${state.accounts.length?state.accounts.slice(0,4).map(accRow).join(''):empty('Hesap eklenmedi','Başlamak için bir banka veya kasa hesabı oluşturun.','Hesap Ekle','new-account')}</section></div>
<div class="lower"><section class="card card-pad"><div class="card-heading"><h3>Son İşlemler</h3><button class="table-action" data-page="transactions">Tüm İşlemler →</button></div>${recent.length?recentRows(recent,true):empty('Henüz işlem yok','Gelir ve gider hareketlerinizi ekleyerek takip etmeye başlayın.','İşlem Ekle','new-tx')}</section><section class="card card-pad"><div class="card-heading"><h3>Yaklaşan Ödemeler & Tahsilatlar</h3><button class="table-action" data-page="obligations">Takvim →</button></div>${dueList(pending().slice(0,4))}<div style="display:flex;justify-content:space-between;gap:10px;margin-top:15px;padding-top:12px;border-top:1px solid var(--border);font-size:11px"><span class="positive">Alacak: <b>${money(t.pendingReceivable)}</b></span><span class="negative">Borç: <b>${money(t.pendingPayable)}</b></span></div></section></div>`}
function transactions(){const monthOpts=[...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort().reverse();const q=ui.txSearch.toLocaleLowerCase('tr-TR');let items=state.transactions.filter(t=>(ui.txType==='all'||t.type===ui.txType)&&(ui.txMonth==='all'||t.date.startsWith(ui.txMonth))&&(!q||[t.description,t.category,accountName(t.accountId),contactName(t.contactId)].some(v=>String(v||'').toLocaleLowerCase('tr-TR').includes(q)))).sort((a,b)=>b.date.localeCompare(a.date));let ti=incomes(items),te=expenses(items);return `${heading('Gelir ve Gider Yönetimi','Finansal hareketleri kaydedin, filtreleyin ve dışa aktarın.',btn(icon('download',16)+' CSV','export-csv')+btn(icon('plus',16)+' Yeni İşlem','new-tx','primary'))}<div class="stats">${stat('Filtrelenmiş Gelir',money(ti),'up','green','Seçili kayıtlardaki gelir')}${stat('Filtrelenmiş Gider',money(te),'down','red','Seçili kayıtlardaki gider')}${stat('Net Nakit Akışı',money(ti-te),'wallet','','Transferler dahil değildir')}${stat('Toplam İşlem',String(items.length),'transactions','orange','Filtreye uyan kayıt sayısı')}</div><section class="card card-pad"><div class="filters"><div class="field-search"><span class="search-icon">${icon('search',15)}</span><input id="tx-search" class="input search-input" placeholder="Açıklama, kategori, hesap ara..." value="${esc(ui.txSearch)}"></div><select id="tx-type" class="select"><option value="all">Tüm İşlemler</option><option value="income" ${ui.txType==='income'?'selected':''}>Gelirler</option><option value="expense" ${ui.txType==='expense'?'selected':''}>Giderler</option><option value="transfer" ${ui.txType==='transfer'?'selected':''}>Transferler</option></select><select id="tx-month" class="select"><option value="all">Tüm Tarihler</option>${monthOpts.map(m=>`<option value="${esc(m)}" ${ui.txMonth===m?'selected':''}>${esc(new Date(m+'-01T12:00').toLocaleDateString('tr-TR',{month:'long',year:'numeric'}))}</option>`).join('')}</select></div>${items.length?recentRows(items):empty('İşlem bulunamadı','Filtreleri değiştirin veya yeni bir gelir/gider kaydı girin.','Yeni İşlem','new-tx')}</section>`}
function accounts(){return `${heading('Banka & Kasa Hesapları','Tüm hesaplarınızın güncel bakiyelerini ve hareketlerini izleyin.',btn(icon('plus',16)+' Hesap Ekle','new-account','primary'))}<div class="item-cards">${state.accounts.map(a=>`<section class="card item-card"><div class="item-card-top"><div class="bank-icon ${a.bank==='Kasa'?'cash':''}">${a.bank==='Kasa'?'₺':icon('accounts',19)}</div><div><div class="item-card-title">${esc(a.name)}</div><div class="item-card-sub">${esc(a.bank||'Banka')} • TRY</div></div></div><div class="item-card-num">${money(accountBalance(a.id))}</div><div class="item-card-bottom"><span class="small-note">Başlangıç: ${money(a.opening)}</span><div class="menu"><button class="table-action" data-action="edit-account" data-id="${esc(a.id)}">Düzenle</button><button class="table-action danger" data-action="delete-account" data-id="${esc(a.id)}">Sil</button></div></div></section>`).join('')}</div>${state.accounts.length?'':`<section class="card">${empty('Hesap oluşturun','Ticari banka hesabı, kişisel hesap veya nakit kasa ekleyin.','Yeni Hesap','new-account')}</section>`}<p class="small-note" style="margin-top:20px">Hesap bakiyesi = başlangıç bakiyesi + gelirler − giderler ± hesaplar arası transferler. Yalnızca Türk lirası desteklenir.</p>`}
function contacts(){const filtered=state.contacts.filter(c=>c.name.toLocaleLowerCase('tr-TR').includes(ui.contactSearch.toLocaleLowerCase('tr-TR')));function contactTotal(c,type){return state.obligations.filter(o=>o.contactId===c.id&&o.type===type).reduce((s,o)=>s+openAmount(o),0)}return `${heading('Cari Hesap Yönetimi','Müşteri ve tedarikçi bakiyelerini, açık alacak ve borçları görüntüleyin.',btn(icon('plus',16)+' Cari Ekle','new-contact','primary'))}<section class="card card-pad"><div class="filters"><div class="field-search"><span class="search-icon">${icon('search',15)}</span><input id="contact-search" class="input search-input" placeholder="Cari hesap ara..." value="${esc(ui.contactSearch)}"></div></div>${filtered.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ünvan / Ad Soyad</th><th>Tür</th><th>Açık Alacak</th><th>Açık Borç</th><th>İşlemler</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><div class="rowtitle">${esc(c.name)}</div><div class="rowsub">${esc(c.phone||c.email||'İletişim bilgisi yok')}</div></td><td>${badge(({customer:'Müşteri',supplier:'Tedarikçi',both:'Her İkisi'})[c.type]||'Cari')}</td><td class="positive amount">${money(contactTotal(c,'receivable'))}</td><td class="negative amount">${money(contactTotal(c,'payable'))}</td><td><button class="table-action" data-action="edit-contact" data-id="${esc(c.id)}">Düzenle</button><button class="table-action danger" data-action="delete-contact" data-id="${esc(c.id)}">Sil</button></td></tr>`).join('')}</tbody></table></div>`:empty('Cari hesap bulunamadı','Müşteri veya tedarikçi kaydı ekleyerek açık borçları takip edin.','Cari Ekle','new-contact')}</section><div class="notice" style="margin-top:18px">Cari bakiyeler, oluşturduğunuz alacak/borç kayıtlarının tahsil edilmemiş veya ödenmemiş tutarlarından hesaplanır. Bir gelir/gider işlemi tek başına cari borcu kapatmaz; ilgili kayıttan “Tahsil Et” veya “Öde” kullanın.</div>`}
function obligations(){let list=state.obligations.filter(o=>ui.obFilter==='all'||(ui.obFilter==='overdue'?(dueStatus(o).cls==='red'):ui.obFilter==='completed'?openAmount(o)<.005:o.type===ui.obFilter)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));let p=pending();let overdue=p.filter(o=>o.dueDate<dateISO(new Date()));return `${heading('Ödeme & Tahsilat Takvimi','Vadeleri kaçırmadan alacaklarınızı ve borçlarınızı yönetin.',btn(icon('plus',16)+' Yeni Planlama','new-ob','primary'))}<div class="cal-group"><div class="info-chip"><span>Açık Alacaklar</span><b class="positive">${money(p.filter(o=>o.type==='receivable').reduce((s,o)=>s+openAmount(o),0))}</b></div><div class="info-chip"><span>Açık Borçlar</span><b class="negative">${money(p.filter(o=>o.type==='payable').reduce((s,o)=>s+openAmount(o),0))}</b></div><div class="info-chip"><span>Gecikmiş Kayıt</span><b>${overdue.length}</b></div><div class="info-chip"><span>Bekleyen İşlem</span><b>${p.length}</b></div></div><section class="card card-pad"><div class="filters"><select class="select" id="ob-filter"><option value="all">Tüm Kayıtlar</option><option value="receivable" ${ui.obFilter==='receivable'?'selected':''}>Tahsilatlar</option><option value="payable" ${ui.obFilter==='payable'?'selected':''}>Ödemeler</option><option value="overdue" ${ui.obFilter==='overdue'?'selected':''}>Gecikenler</option><option value="completed" ${ui.obFilter==='completed'?'selected':''}>Tamamlananlar</option></select></div>${list.length?list.map(o=>{const paid=num(o.amount)-openAmount(o),done=paid>=num(o.amount)-.005,st=dueStatus(o);return `<div class="obligation"><div><div class="obligation-head">${esc(o.description)}</div><div class="obligation-sub">${esc(contactName(o.contactId))}</div></div><div class="obligation-type">${badge(o.type==='receivable'?'Tahsilat':'Ödeme',o.type==='receivable'?'green':'red')}<div class="obligation-sub">Vade: ${dateLabel(o.dueDate)}</div></div><div><div class="obligation-amount">${money(openAmount(o))}</div><div class="obligation-sub">Kalan bakiye</div><div class="progress-bg"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,paid/num(o.amount)*100))}%"></div></div><div class="obligation-sub">${money(paid)} / ${money(o.amount)}</div></div><div>${badge(st.text,st.cls)}</div><div class="obligation-actions">${done?'':`<button class="btn tiny primary" data-action="settle-ob" data-id="${esc(o.id)}">${o.type==='receivable'?'Tahsil Et':'Öde'}</button>`}<button class="table-action" data-action="edit-ob" data-id="${esc(o.id)}">Düzenle</button><button class="table-action danger" data-action="delete-ob" data-id="${esc(o.id)}">Sil</button></div></div>`}).join(''):empty('Kayıt bulunamadı','Vadesi olan bir ödeme veya tahsilat planı oluşturun.','Yeni Kayıt','new-ob')}</section>`}
function reportTx(){let now=new Date(),start=ui.reportPeriod==='month'?dateISO(new Date(now.getFullYear(),now.getMonth(),1)):ui.reportPeriod==='lastmonth'?dateISO(new Date(now.getFullYear(),now.getMonth()-1,1)):ui.reportPeriod==='year'?dateISO(new Date(now.getFullYear(),0,1)):ui.reportPeriod==='30days'?addDays(-29):'0000-01-01';let end=ui.reportPeriod==='lastmonth'?dateISO(new Date(now.getFullYear(),now.getMonth(),0)):'9999-12-31';return state.transactions.filter(t=>t.date>=start&&t.date<=end)}
function reports(){const ts=reportTx(),i=incomes(ts),e=expenses(ts);const cat={};ts.filter(t=>t.type==='expense').forEach(t=>{cat[t.category||'Diğer']=(cat[t.category||'Diğer']||0)+num(t.amount)});const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]);return `${heading('Finansal Raporlar','Nakit akışınızı analiz edin ve işlemleri raporlayın.',btn(icon('download',16)+' Raporu CSV Aktar','export-report','primary'))}<div class="filters"><select id="report-period" class="select"><option value="month" ${ui.reportPeriod==='month'?'selected':''}>Bu Ay</option><option value="lastmonth" ${ui.reportPeriod==='lastmonth'?'selected':''}>Geçen Ay</option><option value="30days" ${ui.reportPeriod==='30days'?'selected':''}>Son 30 Gün</option><option value="year" ${ui.reportPeriod==='year'?'selected':''}>Bu Yıl</option><option value="all" ${ui.reportPeriod==='all'?'selected':''}>Tüm Zamanlar</option></select></div><div class="stats">${stat('Toplam Gelir',money(i),'up','green','Seçili dönemde gerçekleşen')}${stat('Toplam Gider',money(e),'down','red','Seçili dönemde gerçekleşen')}${stat('Net Nakit Akışı',money(i-e),'wallet','','Gelir − gider')}${stat('Gider / Gelir Oranı',i?`%${(e/i*100).toLocaleString('tr-TR',{maximumFractionDigits:1})}`:'—','reports','orange','Giderlerin gelire oranı')}</div><div class="report-grid"><section class="card card-pad"><div class="card-heading"><h3>Son 6 Ayın Nakit Akışı</h3><span class="mini-tab">Aylık Kırılım</span></div>${chart()}</section><section class="card card-pad"><div class="card-heading"><h3>Gider Kategorileri</h3><span class="muted" style="font-size:11px">Seçili Dönem</span></div>${cats.length?cats.map(([cat,amount])=>`<div class="category-row"><div class="category-line"><span>${esc(cat)}</span><strong>${money(amount)}</strong></div><div class="category-track"><div class="category-progress" style="width:${Math.min(100,amount/Math.max(e,1)*100)}%"></div></div></div>`).join(''):empty('Henüz gider yok','Seçilen dönemde gider işlemi bulunamadı.','','')}</section></div><section class="card card-pad report-table"><div class="card-heading"><h3>Dönem İşlem Dökümü</h3><span class="muted" style="font-size:11px">${ts.length} işlem</span></div>${ts.length?recentRows(ts.slice().sort((a,b)=>b.date.localeCompare(a.date)),true):empty('İşlem yok','Başka bir dönem seçin veya kayıt ekleyin.','','')}</section><p class="small-note" style="margin-top:17px">Bu raporlar girilen işlemlere dayalı nakit akışı raporlarıdır; muhasebe kâr/zarar tablosu veya resmi mali tablo değildir.</p>`}
function settings(){return `${heading('Veri Yönetimi & Güvenlik','Bulut hesabınızı, veri yedeklerinizi ve oturumunuzu yönetin.','')}

<section class="card card-pad" style="margin-top:18px"><div class="card-heading"><h3>Hesap Güvenliği</h3></div><p class="subtext">Kullanıcı adı: <b>@${esc(currentUser?.username||'')}</b>. Şifrenizi değiştirdiğinizde diğer cihazlardaki oturumlar sonlandırılır.</p>
<form id="change-password-form" class="security-form"><div class="form-field"><label>Mevcut şifre</label><input class="input" type="password" name="oldPassword" autocomplete="current-password" required></div><div class="form-field"><label>Yeni şifre (en az 12 karakter)</label><input class="input" type="password" name="newPassword" autocomplete="new-password" minlength="12" maxlength="128" required></div><button type="submit" class="btn primary">Şifreyi Değiştir</button></form>
<div class="settings-row"><div><strong>Oturumu sonlandır</strong><p>Bu cihazdan güvenli çıkış yapın.</p></div>${btn('Çıkış Yap','logout')}</div></section>
<section class="card card-pad" style="margin-top:18px"><div class="card-heading"><h3>Bulut & Veri Güvenliği</h3></div><p class="subtext" style="margin-top:0">Finans kayıtlarınız oturum açtığınız kullanıcıya özel PostgreSQL veritabanında saklanır. İşlemler sürüm kontrolüyle senkronize edilir; çakışan değişiklikler sessizce üzerine yazılmaz. Bu sürüm banka hesaplarına otomatik bağlanmaz; bakiyeler girilen işlemlerden hesaplanır. Düzenli veritabanı yedeği etkinleştirmek sunucu yöneticisinin sorumluluğundadır.</p></section>`}
function render(){const names={dashboard:'Genel Bakış',transactions:'Gelir & Giderler',accounts:'Banka Hesapları',contacts:'Cari Hesaplar',obligations:'Ödeme Takvimi',reports:'Finansal Raporlar',settings:'Veri & Ayarlar'};const pages={dashboard,transactions,accounts,contacts,obligations,reports,settings};document.title=`${names[ui.page]} | Finova`;document.getElementById('app').innerHTML=`<div class="app">${side()}<main class="main">${header()}<div class="content">${(pages[ui.page]||dashboard)()}<p class="footer">Finova Cloud • Güvenli bulut senkronizasyonu • ₺ TRY</p></div></main><button class="mobile-add" data-action="new-tx" aria-label="İşlem ekle">+</button></div>`}
function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast._timer);toast._timer=setTimeout(()=>{root.innerHTML=''},3400)}
const modal=(title,html)=>{document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" id="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="Kapat">×</button></div><div class="modal-body">${html}</div></div></div>`};
const closeModal=()=>document.getElementById('modal-root').innerHTML='';
const field=(label,name,value='',type='text',opts='')=>`<div class="form-field"><label for="f-${name}">${label}</label><input class="input" id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${opts}></div>`;
const selectField=(label,name,options,value='',extra='')=>`<div class="form-field"><label for="f-${name}">${label}</label><select class="select" id="f-${name}" name="${name}" ${extra}>${options.map(o=>`<option value="${esc(o[0])}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
const formEnd=()=>`<div class="form-actions"><button type="button" class="btn" data-action="close-modal">Vazgeç</button><button class="btn primary" type="submit">${icon('check',16)} Kaydet</button></div></form>`;
function transactionModal(id=null,pref={}){const t=state.transactions.find(x=>x.id===id)||{};const val={type:pref.type||t.type||'expense',date:t.date||dateISO(new Date()),description:t.description||'',amount:pref.amount||t.amount||'',category:t.category||'',accountId:pref.accountId||t.accountId||state.accounts[0]?.id||'',toAccountId:t.toAccountId||state.accounts[1]?.id||'',contactId:pref.contactId||t.contactId||'',obligationId:pref.obligationId||t.obligationId||''};if(!state.accounts.length){toast('Önce banka veya kasa hesabı eklemelisiniz.');accountModal();return;}let opts=state.accounts.map(a=>[a.id,a.name+' · '+a.bank]);const contactOpts=[['','— Cari seçilmedi —'],...state.contacts.map(c=>[c.id,c.name])];modal(id?'İşlemi Düzenle':'Yeni Finansal İşlem',`<form id="form-transaction"><input type="hidden" name="id" value="${esc(id||'')}"><input type="hidden" name="obligationId" value="${esc(val.obligationId)}"><div class="form-grid"><div class="form-field full"><label>İşlem Türü</label><div class="type-switch">${[['income','Gelir'],['expense','Gider'],['transfer','Transfer']].map(([k,n])=>`<label><input type="radio" name="type" value="${k}" ${val.type===k?'checked':''} ${val.obligationId&&val.type!==k?'disabled':''}>${n}</label>`).join('')}</div></div>${field('Tutar (₺) *','amount',val.amount,'number','min="0.01" max="999999999999" step="0.01" required')}${field('İşlem Tarihi *','date',val.date,'date','required')}${selectField('İlgili Hesap *','accountId',opts,val.accountId)}<div class="form-field" id="transfer-to-wrap">${selectField('Hedef Hesap *','toAccountId',opts,val.toAccountId).replace(/^<div class="form-field">/,'').replace(/<\/div>$/,'')}</div><div class="form-field" id="tx-category-wrap"><label for="f-category">Kategori</label><input class="input" id="f-category" name="category" value="${esc(val.category)}" list="category-list" placeholder="Örn. Kira, Satış"><datalist id="category-list">${['Ürün Satışı','Hizmet Satışı','Diğer Gelir','Kira','Personel','Pazarlama','Tedarik','Ekipman','Operasyon','Yazılım','Vergi','Diğer Gider'].map(c=>`<option value="${c}">`).join('')}</datalist></div><div class="form-field" id="tx-contact-wrap">${selectField('Cari Hesap (İsteğe bağlı)','contactId',contactOpts,val.contactId).replace(/^<div class="form-field">/,'').replace(/<\/div>$/,'')}</div><div class="form-field full"><label for="f-description">Açıklama *</label><input class="input" name="description" id="f-description" value="${esc(val.description)}" placeholder="İşlem açıklaması" maxlength="170" required></div></div>${val.obligationId?'<div class="compact-hint">Bu işlem bir vade kaydına bağlıdır. Tutar değişiklikleri ilgili açık bakiyeyi günceller.</div>':''}${formEnd()}`);updateTransactionType();}
function updateTransactionType(){const form=document.getElementById('form-transaction');if(!form)return;const type=form.querySelector('[name="type"]:checked')?.value;const target=document.getElementById('transfer-to-wrap');target.style.display=type==='transfer'?'':'none';document.getElementById('tx-category-wrap').style.display=type==='transfer'?'none':'';document.getElementById('tx-contact-wrap').style.display=type==='transfer'?'none':'';}
function accountModal(id){let a=state.accounts.find(x=>x.id===id)||{};modal(id?'Hesabı Düzenle':'Yeni Banka / Kasa Hesabı',`<form id="form-account"><input type="hidden" name="id" value="${esc(id||'')}"><div class="form-grid">${field('Hesap Adı *','name',a.name||'','text','maxlength="80" placeholder="Örn. Ticari Hesap" required')}${selectField('Hesap Türü / Banka *','bank',[['İş Bankası','İş Bankası'],['Garanti BBVA','Garanti BBVA'],['Ziraat Bankası','Ziraat Bankası'],['Akbank','Akbank'],['Yapı Kredi','Yapı Kredi'],['VakıfBank','VakıfBank'],['Halkbank','Halkbank'],['QNB','QNB'],['DenizBank','DenizBank'],['Kasa','Nakit Kasa'],['Diğer','Diğer']],a.bank||'İş Bankası')}${field('Başlangıç Bakiyesi (₺) *','opening',a.opening??0,'number','step="0.01" required')}<div class="form-field"><label>Para Birimi</label><input class="input" value="Türk Lirası (TRY)" disabled></div></div><p class="small-note">Hesap bakiyesi, başlangıç tutarına kayıtlı işlemlerin etkisi eklenerek hesaplanır.</p>${formEnd()}`)}
function contactModal(id){let c=state.contacts.find(x=>x.id===id)||{};modal(id?'Cari Hesabı Düzenle':'Yeni Cari Hesap',`<form id="form-contact"><input type="hidden" name="id" value="${esc(id||'')}"><div class="form-grid"><div class="form-field full">${field('Firma / Kişi Adı *','name',c.name||'','text','maxlength="130" required').replace(/^<div class="form-field">/,'').replace(/<\/div>$/,'')}</div>${selectField('Cari Türü *','type',[['customer','Müşteri'],['supplier','Tedarikçi'],['both','Müşteri ve Tedarikçi']],c.type||'customer')}${field('Telefon','phone',c.phone||'','tel','maxlength="30"')}${field('E-posta','email',c.email||'','email','maxlength="130"')}</div>${formEnd()}`)}
function obModal(id){let o=state.obligations.find(x=>x.id===id)||{};const opts=[['','— Cari hesap seçiniz —'],...state.contacts.map(c=>[c.id,c.name])];if(!state.contacts.length){toast('Önce bir cari hesap eklemelisiniz.');contactModal();return;}modal(id?'Vadeli Kaydı Düzenle':'Yeni Ödeme / Tahsilat Planı',`<form id="form-ob"><input type="hidden" name="id" value="${esc(id||'')}"><div class="form-grid">${selectField('İşlem Türü *','type',[['receivable','Tahsil Edilecek (Alacak)'],['payable','Ödenecek (Borç)']],o.type||'receivable')}${selectField('Cari Hesap *','contactId',opts,o.contactId||state.contacts[0]?.id,'required')}${field('Toplam Tutar (₺) *','amount',o.amount||'','number','min="0.01" step="0.01" required')}${field('Vade Tarihi *','dueDate',o.dueDate||addDays(7),'date','required')}<div class="form-field full">${field('Açıklama *','description',o.description||'','text','maxlength="160" placeholder="Örn. Kasım ayı tedarikçi faturası" required').replace(/^<div class="form-field">/,'').replace(/<\/div>$/,'')}</div></div><p class="small-note">Bu plan hesap bakiyesini etkilemez. Tahsilat/ödeme gerçekleştiğinde ilgili kayıttan işlem oluşturun.</p>${formEnd()}`)}
const readForm=f=>Object.fromEntries(new FormData(f).entries());
function formSubmit(e){const f=e.target,formId=f.getAttribute('id');if(!formId||!formId.startsWith('form-'))return;e.preventDefault();const d=readForm(f),id=d.id||uid();try{if(formId==='form-account'){if(!d.name.trim()||!Number.isFinite(Number(d.opening)))throw Error('Hesap bilgilerini kontrol edin.');const obj={id,name:d.name.trim(),bank:d.bank,opening:num(d.opening)};state.accounts=d.id?state.accounts.map(x=>x.id===d.id?obj:x):[...state.accounts,obj];}
else if(formId==='form-contact'){if(!d.name.trim())throw Error('Cari adı girin.');const obj={id,name:d.name.trim(),type:d.type,phone:d.phone.trim(),email:d.email.trim()};state.contacts=d.id?state.contacts.map(x=>x.id===d.id?obj:x):[...state.contacts,obj];}
else if(formId==='form-ob'){const amount=num(d.amount);if(!(amount>0))throw Error('Tutar sıfırdan büyük olmalıdır.');const prev=state.obligations.find(x=>x.id===d.id);const paid=prev?num(prev.amount)-openAmount(prev):0;if(amount+0.005<paid)throw Error('Toplam tutar tahsil/ödenmiş tutardan küçük olamaz.');if(prev&&paid>0&&prev.type!==d.type)throw Error('İşlem yapılan bir kaydın türü değiştirilemez.');if(!d.contactId||!state.contacts.some(x=>x.id===d.contactId)||!d.dueDate||!d.description.trim())throw Error('Zorunlu alanları doldurun.');const obj={id,type:d.type,contactId:d.contactId,amount,dueDate:d.dueDate,description:d.description.trim()};state.obligations=d.id?state.obligations.map(x=>x.id===d.id?obj:x):[...state.obligations,obj];}
else if(formId==='form-transaction'){const amount=num(d.amount);if(!(amount>0))throw Error('Tutar sıfırdan büyük olmalıdır.');if(!state.accounts.some(a=>a.id===d.accountId))throw Error('Bir hesap seçin.');if(d.type==='transfer'&&(!d.toAccountId||d.accountId===d.toAccountId))throw Error('Transfer için farklı bir hedef hesap seçin.');if(!d.date||!d.description.trim())throw Error('Tarih ve açıklama zorunludur.');const prev=state.transactions.find(x=>x.id===d.id),obId=d.obligationId||null;const related=obId?state.obligations.find(o=>o.id===obId):null;if(related){if(related.type==='receivable'&&d.type!=='income'||related.type==='payable'&&d.type!=='expense')throw Error('Planla uyumsuz işlem türü.');const otherPaid=state.transactions.filter(t=>t.obligationId===obId&&t.id!==d.id).reduce((s,t)=>s+num(t.amount),0);if(amount+otherPaid>num(related.amount)+.005)throw Error('Tutar planın kalan bakiyesini aşıyor.')}const obj={id,type:d.type,amount,date:d.date,description:d.description.trim(),category:d.type==='transfer'?'Transfer':(d.category.trim()||(d.type==='income'?'Diğer Gelir':'Diğer Gider')),accountId:d.accountId,toAccountId:d.type==='transfer'?d.toAccountId:null,contactId:d.type==='transfer'?null:d.contactId||null,obligationId:obId};if(prev&&prev.obligationId&&prev.obligationId!==obId)throw Error('Bağlı vade kaydı değiştirilemez.');state.transactions=d.id?state.transactions.map(x=>x.id===d.id?obj:x):[...state.transactions,obj];}
else return;save();closeModal();render();toast('Kayıt buluta gönderildi.');}catch(err){toast(err.message||'Kayıt tamamlanamadı.')}}
function settle(id){const o=state.obligations.find(x=>x.id===id);if(!o)return;transactionModal(null,{type:o.type==='receivable'?'income':'expense',amount:openAmount(o),contactId:o.contactId,obligationId:o.id});const f=document.getElementById('form-transaction');if(f){const desc=f.querySelector('[name="description"]');desc.value=o.description;f.querySelector('[name="category"]').value=o.type==='receivable'?'Tahsilat':'Ödeme';}}
function remove(kind,id){let ref=state[kind].find(x=>x.id===id);if(!ref)return;if(kind==='accounts'&&state.transactions.some(t=>t.accountId===id||t.toAccountId===id))return toast('Hesaba bağlı işlemler bulunuyor. Silmek için önce bu işlemleri kaldırın.');if(kind==='contacts'&&(state.obligations.some(o=>o.contactId===id)||state.transactions.some(t=>t.contactId===id)))return toast('Cari hesaba bağlı kayıtlar var. Önce ilişkili kayıtları kaldırın.');if(kind==='obligations'&&state.transactions.some(t=>t.obligationId===id))return toast('Bu vade kaydına bağlı işlemler var; önce bunları silin.');if(!confirm('Bu kaydı silmek istediğinize emin misiniz?'))return;state[kind]=state[kind].filter(x=>x.id!==id);save();render();toast('Kayıt silindi.');}
function csvCell(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(ts=state.transactions){const rows=[['Tarih','Tür','Açıklama','Kategori','Hesap','Hedef Hesap','Cari Hesap','Tutar (TRY)'],...ts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,({income:'Gelir',expense:'Gider',transfer:'Transfer'})[t.type],t.description,t.category,accountName(t.accountId),t.type==='transfer'?accountName(t.toAccountId):'',t.contactId?contactName(t.contactId):'',num(t.amount).toFixed(2).replace('.',',')])];const data='\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');download(new Blob([data],{type:'text/csv;charset=utf-8'}),'finova-islemler-'+dateISO(new Date())+'.csv')}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){download(new Blob([JSON.stringify({format:'finova-backup-v1',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),'finova-yedek-'+dateISO(new Date())+'.json')}
function importJSON(){let input=document.getElementById('import-file');if(!input){input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.id='import-file';input.style.display='none';document.body.appendChild(input);input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(parsed.format!=='finova-backup-v1')throw Error('Bu dosya Finova yedeği değil.');let d=parsed.data;if(!d||!['accounts','contacts','transactions','obligations'].every(k=>Array.isArray(d[k])))throw Error('Dosya eksik veya bozuk.');if(!confirm('Yedeği geri yüklemek mevcut tüm kayıtların üzerine yazacak. Devam edilsin mi?'))return;state={demo:!!d.demo,accounts:d.accounts,contacts:d.contacts,transactions:d.transactions,obligations:d.obligations};save();render();toast('Yedek buluta gönderildi.')}catch(e){toast(e.message||'Dosya okunamadı.')}finally{input.value=''}})}input.click()}
function action(act,id){switch(act){
case 'show-login':showAuth('login');return;
case 'show-register':if(signupEnabled)showAuth('register');return;
case 'toggle-password':{const i=document.getElementById('auth-password');if(i){i.type=i.type==='password'?'text':'password';}return;}
case 'boot':boot();return;
case 'logout':(async()=>{if(pendingSaves||syncLocked){if(!confirm('Kaydedilmemiş değişiklikler olabilir. Yedek almayı ve çıkış yapmayı onaylıyor musunuz?'))return;}
try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch{};
if(stream){stream.close();stream=null;}if(pollingTimer){clearInterval(pollingTimer);pollingTimer=null;}
currentUser=null;state=blank();syncLocked=false;showAuth('login');})();return;
case 'retry-sync':{
  if(!syncLocked)return;
  syncLocked=false;document.getElementById('sync-alert').innerHTML='';pendingSaves=0;saveTail=Promise.resolve();save();return;
}
case 'reload-cloud':{
  if(!confirm('Bu cihazdaki kaydedilemeyen değişiklikler silinecek. Önce JSON yedeği aldığınızdan emin misiniz?'))return;
  syncLocked=false;pendingSaves=0;saveTail=Promise.resolve();document.getElementById('sync-alert').innerHTML='';
  fetchCloud(true);return;
}
case 'new-tx':transactionModal();break;case 'edit-tx':transactionModal(id);break;case 'delete-tx':remove('transactions',id);break;case 'new-account':accountModal();break;case 'edit-account':accountModal(id);break;case 'delete-account':remove('accounts',id);break;case 'new-contact':contactModal();break;case 'edit-contact':contactModal(id);break;case 'delete-contact':remove('contacts',id);break;case 'new-ob':obModal();break;case 'edit-ob':obModal(id);break;case 'delete-ob':remove('obligations',id);break;case 'settle-ob':settle(id);break;case 'close-modal':closeModal();break;case 'close-menu':ui.drawer=false;render();break;case 'export-csv':exportCSV();break;case 'export-report':exportCSV(reportTx());break;case 'export-json':exportJSON();break;case 'import-json':importJSON();break;case 'clear-data':if(confirm('TÜM banka, cari, işlem ve vade kayıtları kalıcı olarak silinecek. Önce yedek almanız önerilir. Devam edilsin mi?')){state=blank();save();ui.page='dashboard';render();toast('Tüm veriler temizlendi.')}break;case 'reset-demo':if(confirm('Mevcut tüm veriler örnek verilerle değiştirilecek. Devam edilsin mi?')){state=demo();save();ui.page='dashboard';render();toast('Örnek veriler yüklendi.')}break;}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){ui.page=nav.dataset.page;ui.drawer=false;render();window.scrollTo({top:0,behavior:'instant'});return;}if(e.target.closest('#open-menu')){ui.drawer=true;render();return;}const el=e.target.closest('[data-action]');if(el){action(el.dataset.action,el.dataset.id);return;}if(e.target.id==='modal-wrap')closeModal()});
document.addEventListener('submit',handleAuthSubmit);
document.addEventListener('submit',formSubmit);
document.addEventListener('change',e=>{if(e.target.name==='type'&&e.target.closest('#form-transaction')){updateTransactionType();return;}const ids={'tx-type':['txType'],'tx-month':['txMonth'],'ob-filter':['obFilter'],'report-period':['reportPeriod']};if(ids[e.target.id]){ui[ids[e.target.id][0]]=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='tx-search'||e.target.id==='contact-search'){let id=e.target.id,v=e.target.value,pos=e.target.selectionStart;ui[id==='tx-search'?'txSearch':'contactSearch']=v;render();let re=document.getElementById(id);if(re){re.focus();try{re.setSelectionRange(pos,pos)}catch{}}}});
boot();
})();
</script>
</body>
</html>
